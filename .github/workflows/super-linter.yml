---
# .github/workflows/super-linter.yml
name: Super-Linter

# Run this workflow every time a new commit pushed to your repository
on: push

permissions: read-all

jobs:
  # Set the job key. The key is displayed as the job name
  # when a job name is not provided
  super-lint:
    # Name the Job
    name: Lint code base
    # Set the type of machine to run on
    runs-on: ubuntu-latest

    # Job-level permissions override the read-all default
    permissions:
      contents: read
      statuses: write

    steps:
      # Checks out a copy of your repository on the ubuntu-latest machine
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Runs the Super-Linter action
      - name: Run Super-Linter
        uses: super-linter/super-linter/slim@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        env:
          DEFAULT_BRANCH: ${{ github.ref_name }}
          # disable checkstyle, use google java format
          VALIDATE_JAVA: false
          # spotless validation always uses older version, thus collide with super-linter rule subset
          VALIDATE_GOOGLE_JAVA_FORMAT: false
          SQLFLUFF_CONFIG_FILE: .sqlfluff
          FILTER_REGEX_EXCLUDE: .*gradlew
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
